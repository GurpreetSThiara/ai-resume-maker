name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci` runs the postinstall that copies the pdf worker into public/.
      - run: npm ci

      # No secret may be exposed under a NEXT_PUBLIC_ name. Cheapest check, so
      # it runs first.
      - run: npm run check:env

      - run: npm run typecheck

      - run: npm run lint

      - run: npm run build
        env:
          # Build-time placeholders. The real values live in the deployment
          # environment; these only need to exist so the client bundle compiles.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
